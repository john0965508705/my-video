```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>選擇你的窗口</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    }


    body {
      min-height: 100dvh;
    }


    .screen {

      width: 100%;
      height: 100dvh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        env(safe-area-inset-top)
        24px
        env(safe-area-inset-bottom)
        24px;

      text-align: center;

    }


    /* ================================
       選擇頁面
       ================================ */

    #selection {

      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

    }


    .title {

      font-size:
        clamp(24px, 7vw, 36px);

      font-weight: 400;

      letter-spacing: 0.12em;

      margin-bottom: 55px;

    }


    .options {

      width: 100%;

      max-width: 360px;

      display: flex;

      flex-direction: column;

      gap: 16px;

    }


    .option {

      width: 100%;

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 16px 20px;

      background: transparent;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.55);

      border-radius: 999px;

      font-size: 17px;

      letter-spacing: 0.08em;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.1s ease;

    }


    .option:active {

      background: #fff;

      color: #000;

      transform: scale(0.97);

    }


    /* ================================
       倒數畫面
       ================================ */

    #countdown {

      display: none;

      width: 100%;
      height: 100%;

      align-items: center;
      justify-content: center;

    }


    #number {

      font-size:
        clamp(120px, 35vw, 220px);

      font-weight: 200;

      line-height: 1;

      letter-spacing: 0;

      font-variant-numeric:
        tabular-nums;

    }


    /* ================================
       最後 fallback
       ================================ */

    #fallback {

      display: none;

      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        20px
        24px
        calc(20px + env(safe-area-inset-bottom))
        24px;

      text-align: center;

      background: #000;

    }


    #fallback a {

      display: inline-block;

      padding: 13px 24px;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.6);

      border-radius: 999px;

      text-decoration: none;

      font-size: 14px;

      letter-spacing: 0.06em;

    }

  </style>

</head>


<body>


  <main class="screen">


    <!-- ================================
         選擇你的窗口
         ================================ -->

    <section id="selection">


      <div class="title">
        選擇你的窗口
      </div>


      <div class="options">


        <button
          class="option"
          onclick="startCountdown('instagram')"
        >
          IG Reels
        </button>


        <button
          class="option"
          onclick="startCountdown('facebook')"
        >
          Facebook Reels
        </button>


        <button
          class="option"
          onclick="startCountdown('threads')"
        >
          Threads
        </button>


      </div>


    </section>


    <!-- ================================
         黑屏倒數
         ================================ -->

    <section id="countdown">

      <div id="number">
        10
      </div>

    </section>


  </main>


  <!-- ================================
       網頁 fallback
       ================================ -->

  <div id="fallback">

    <a
      id="fallbackLink"
      href="#"
    >
      開啟網頁版
    </a>

  </div>


  <script>


    /*
     * ==========================================
     * 基本設定
     * ==========================================
     */

    const COUNTDOWN_SECONDS = 10;


    /*
     * ==========================================
     * iPhone / iPad App Scheme
     * ==========================================
     */

    const iosLinks = {

      instagram:
        "instagram://",

      facebook:
        "fb://",

      threads:
        "barcelona://"

    };


    /*
     * ==========================================
     * Android Intent
     *
     * package：
     *
     * Instagram
     * Facebook
     * Threads
     * ==========================================
     */

    const androidLinks = {

      instagram:
        "intent://#Intent;scheme=instagram;package=com.instagram.android;end",

      facebook:
        "intent://#Intent;scheme=fb;package=com.facebook.katana;end",

      threads:
        "intent://#Intent;scheme=barcelona;package=com.instagram.barcelona;end"

    };


    /*
     * ==========================================
     * 網頁版
     * ==========================================
     */

    const webLinks = {

      instagram:
        "https://www.instagram.com/",

      facebook:
        "https://www.facebook.com/",

      threads:
        "https://www.threads.net/"

    };


    /*
     * ==========================================
     * 狀態
     * ==========================================
     */

    let isRunning = false;


    /*
     * ==========================================
     * 判斷 Android
     * ==========================================
     */

    function isAndroid() {

      return /Android/i.test(
        navigator.userAgent
      );

    }


    /*
     * ==========================================
     * 判斷 iPhone / iPad
     * ==========================================
     */

    function isIOS() {

      return /iPhone|iPad|iPod/i.test(
        navigator.userAgent
      );

    }


    /*
     * ==========================================
     * 開始倒數
     * ==========================================
     */

    function startCountdown(appName) {


      if (isRunning) {

        return;

      }


      isRunning = true;


      /*
       * 隱藏選擇頁面
       */

      document
        .getElementById("selection")
        .style.display = "none";


      /*
       * 顯示黑屏
       */

      document
        .getElementById("countdown")
        .style.display = "flex";


      /*
       * 初始數字
       */

      let seconds =
        COUNTDOWN_SECONDS;


      document
        .getElementById("number")
        .textContent =
        seconds;


      /*
       * ========================================
       * 每秒倒數
       * ========================================
       */

      const timer =
        setInterval(function () {


          seconds--;


          document
            .getElementById("number")
            .textContent =
            seconds;


          /*
           * ======================================
           * 到 0
           * ======================================
           */

          if (seconds <= 0) {


            clearInterval(timer);


            /*
             * 留 150ms，
             * 確保觀眾看見 0。
             */

            setTimeout(function () {

              openApp(appName);

            }, 150);

          }


        }, 1000);

    }


    /*
     * ==========================================
     * 開啟 App
     * ==========================================
     */

    function openApp(appName) {


      let appURL;


      /*
       * ========================================
       * Android
       * ========================================
       */

      if (isAndroid()) {

        appURL =
          androidLinks[appName];

      }


      /*
       * ========================================
       * iPhone / iPad
       * ========================================
       */

      else if (isIOS()) {

        appURL =
          iosLinks[appName];

      }


      /*
       * ========================================
       * 其他裝置
       * ========================================
       */

      else {

        appURL =
          webLinks[appName];

      }


      /*
       * ========================================
       * 嘗試開啟 App
       * ========================================
       */

      try {

        window.location.href =
          appURL;

      } catch (error) {

        showFallback(
          webLinks[appName]
        );

        return;

      }


      /*
       * ========================================
       * 不立即強制跳轉
       *
       * 給 Android / iOS 更多時間
       * 接管 App。
       * ========================================
       */

      setTimeout(function () {


        /*
         * 如果頁面仍然在前景，
         * 才顯示網頁 fallback。
         */

        if (
          document.visibilityState ===
          "visible"
        ) {

          showFallback(
            webLinks[appName]
          );

        }


      }, 3000);

    }


    /*
     * ==========================================
     * 顯示 fallback
     * ==========================================
     */

    function showFallback(url) {


      const fallback =
        document.getElementById(
          "fallback"
        );


      const link =
        document.getElementById(
          "fallbackLink"
        );


      link.href = url;


      fallback.style.display =
        "block";

    }


  </script>


</body>

</html>
