<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>選擇你的窗口</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    }


    body {
      min-height: 100dvh;
    }


    /*
     * ==========================================
     * 主畫面
     * ==========================================
     */

    .screen {

      width: 100%;
      height: 100dvh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        env(safe-area-inset-top)
        24px
        env(safe-area-inset-bottom)
        24px;

      text-align: center;

    }


    /*
     * ==========================================
     * 選擇頁面
     * ==========================================
     */

    #selection {

      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

    }


    .title {

      font-size:
        clamp(24px, 7vw, 36px);

      font-weight: 400;

      letter-spacing: 0.12em;

      margin-bottom: 55px;

    }


    .options {

      width: 100%;

      max-width: 360px;

      display: flex;

      flex-direction: column;

      gap: 16px;

    }


    .option {

      width: 100%;

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 16px 20px;

      background: transparent;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.55);

      border-radius: 999px;

      font-size: 17px;

      letter-spacing: 0.08em;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.1s ease;

    }


    .option:active {

      background: #fff;

      color: #000;

      transform: scale(0.97);

    }


    /*
     * ==========================================
     * 黑屏倒數
     * ==========================================
     */

    #countdown {

      display: none;

      width: 100%;
      height: 100%;

      align-items: center;
      justify-content: center;

    }


    #number {

      font-size:
        clamp(120px, 35vw, 220px);

      font-weight: 200;

      line-height: 1;

      letter-spacing: 0;

      font-variant-numeric:
        tabular-nums;

    }

  </style>

</head>


<body>


  <main class="screen">


    <!-- ========================================
         選擇你的窗口
         ======================================== -->

    <section id="selection">


      <div class="title">
        選擇你的窗口
      </div>


      <div class="options">


        <button
          class="option"
          onclick="startCountdown('instagram')"
        >
          IG Reels
        </button>


        <button
          class="option"
          onclick="startCountdown('facebook')"
        >
          Facebook Reels
        </button>


        <button
          class="option"
          onclick="startCountdown('threads')"
        >
          Threads
        </button>


      </div>


    </section>


    <!-- ========================================
         黑色倒數畫面
         ======================================== -->

    <section id="countdown">


      <div id="number">
        10
      </div>


    </section>


  </main>


  <script>


    /*
     * ==================================================
     * 設定倒數秒數
     * ==================================================
     */

    const COUNTDOWN_SECONDS = 10;


    /*
     * ==================================================
     * App Deep Link
     *
     * 只負責開啟 App。
     *
     * 不使用：
     *
     * instagram://reels/
     * fb://reels/
     *
     * 避免之前 iPhone Instagram 發生錯誤。
     * ==================================================
     */

    const appLinks = {

      instagram:
        "instagram://",

      facebook:
        "fb://",

      threads:
        "barcelona://"

    };


    /*
     * ==================================================
     * 網頁 fallback
     * ==================================================
     */

    const webLinks = {

      instagram:
        "https://www.instagram.com/",

      facebook:
        "https://www.facebook.com/",

      threads:
        "https://www.threads.net/"

    };


    /*
     * ==================================================
     * 防止重複點擊
     * ==================================================
     */

    let isRunning = false;


    /*
     * ==================================================
     * 開始倒數
     * ==================================================
     */

    function startCountdown(appName) {


      /*
       * 如果已經開始，
       * 不允許再次點擊。
       */

      if (isRunning) {

        return;

      }


      isRunning = true;


      /*
       * 隱藏選擇頁面
       */

      document
        .getElementById("selection")
        .style.display = "none";


      /*
       * 顯示黑色倒數畫面
       */

      document
        .getElementById("countdown")
        .style.display = "flex";


      /*
       * 設定初始數字
       */

      let seconds =
        COUNTDOWN_SECONDS;


      document
        .getElementById("number")
        .textContent =
        seconds;


      /*
       * ==============================================
       * 每秒倒數一次
       * ==============================================
       */

      const timer =
        setInterval(function () {


          seconds--;


          /*
           * 顯示新的數字
           */

          document
            .getElementById("number")
            .textContent =
            seconds;


          /*
           * ==========================================
           * 倒數到 0
           * ==========================================
           */

          if (seconds <= 0) {


            clearInterval(timer);


            /*
             * 稍微停留一下 0
             *
             * 讓觀眾確實看到「0」。
             */

            setTimeout(function () {

              openSelectedApp(appName);

            }, 150);


          }


        }, 1000);

    }


    /*
     * ==================================================
     * 開啟選擇的 App
     * ==================================================
     */

    function openSelectedApp(appName) {


      const appURL =
        appLinks[appName];


      const webURL =
        webLinks[appName];


      /*
       * ==============================================
       * 嘗試開啟 App
       * ==============================================
       */

      try {

        window.location.href =
          appURL;

      } catch (error) {

        /*
         * 如果 Deep Link 無法使用，
         * 開啟網頁版。
         */

        window.location.href =
          webURL;

      }


      /*
       * ==============================================
       * Fallback
       *
       * 如果手機沒有安裝 App，
       * Deep Link 不會成功，
       * 約 1.5 秒後開啟網頁版。
       * ==============================================
       */

      setTimeout(function () {

        /*
         * 只有當目前頁面仍然可見時，
         * 才代表 App 很可能沒有成功開啟。
         */

        if (
          document.visibilityState ===
          "visible"
        ) {

          window.location.href =
            webURL;

        }

      }, 1500);

    }


  </script>


</body>

</html>
