```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>選擇你的窗口</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    }


    body {
      min-height: 100dvh;
    }


    .screen {

      width: 100%;
      height: 100dvh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        env(safe-area-inset-top)
        24px
        env(safe-area-inset-bottom)
        24px;

      text-align: center;

    }


    /*
     * ===============================
     * 標題
     * ===============================
     */

    .title {

      font-size:
        clamp(24px, 7vw, 36px);

      font-weight: 400;

      letter-spacing: 0.12em;

      margin-bottom: 55px;

    }


    /*
     * ===============================
     * 三個選項
     * ===============================
     */

    .options {

      width: 100%;

      max-width: 360px;

      display: flex;

      flex-direction: column;

      gap: 16px;

    }


    .option {

      width: 100%;

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 16px 20px;

      background: transparent;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.55);

      border-radius: 999px;

      font-size: 17px;

      letter-spacing: 0.08em;

      text-decoration: none;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.1s ease;

    }


    .option:active {

      background: #fff;

      color: #000;

      transform: scale(0.97);

    }


    /*
     * ===============================
     * 黑屏倒數
     * ===============================
     */

    #countdown {

      display: none;

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100dvh;

      align-items: center;
      justify-content: center;

      background: #000;

      z-index: 1000;

    }


    #number {

      font-size:
        clamp(120px, 35vw, 220px);

      font-weight: 200;

      line-height: 1;

      letter-spacing: 0;

      font-variant-numeric:
        tabular-nums;

    }


    /*
     * ===============================
     * Loading
     * ===============================
     */

    .loading {

      display: none;

      margin-top: 35px;

      font-size: 15px;

      letter-spacing: 0.08em;

      opacity: 0.7;

    }


    .spinner {

      width: 18px;

      height: 18px;

      margin: 18px auto 0;

      border:
        1.5px solid rgba(255,255,255,0.25);

      border-top-color: #fff;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /*
     * ===============================
     * Fallback
     * ===============================
     */

    .fallback {

      display: none;

      margin-top: 35px;

    }


    .fallback.show {

      display: block;

    }


    .fallback a {

      display: inline-block;

      padding: 13px 22px;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.6);

      border-radius: 999px;

      text-decoration: none;

      font-size: 14px;

      letter-spacing: 0.06em;

    }


    .note {

      display: none;

      margin-top: 14px;

      max-width: 300px;

      font-size: 12px;

      line-height: 1.6;

      opacity: 0.5;

    }


    .note.show {

      display: block;

    }

  </style>

</head>


<body>


  <main class="screen">


    <!-- ===============================
         選擇你的窗口
         =============================== -->

    <div
      class="title"
      id="title"
    >
      選擇你的窗口
    </div>


    <!-- ===============================
         三個選項
         =============================== -->

    <div
      class="options"
      id="options"
    >


      <a
        class="option"
        href="https://www.instagram.com/"
        onclick="startCountdown(event, 'instagram')"
      >
        IG Reels
      </a>


      <a
        class="option"
        href="https://www.facebook.com/"
        onclick="startCountdown(event, 'facebook')"
      >
        Facebook Reels
      </a>


      <a
        class="option"
        href="https://www.threads.net/"
        onclick="startCountdown(event, 'threads')"
      >
        Threads
      </a>


    </div>


    <!-- ===============================
         原本的 Loading
         =============================== -->

    <div
      class="loading"
      id="loading"
    >

      正在開啟……

      <div class="spinner"></div>

    </div>


    <!-- ===============================
         原本的 fallback
         =============================== -->

    <div
      class="fallback"
      id="fallback"
    >

      <a
        id="fallbackLink"
        href="#"
      >
        在瀏覽器開啟
      </a>

    </div>


    <div
      class="note"
      id="note"
    >

      如果 App 沒有自動開啟，
      請點擊上方按鈕。

    </div>


  </main>


  <!-- ===============================
       黑屏倒數
       =============================== -->

  <div
    id="countdown"
  >

    <div
      id="number"
    >
      10
    </div>

  </div>


  <script>


    /*
     * ==================================================
     * 網頁 fallback
     * ==================================================
     */

    const websites = {

      instagram:
        "https://www.instagram.com/",

      facebook:
        "https://www.facebook.com/",

      threads:
        "https://www.threads.net/"

    };


    /*
     * ==================================================
     * 原本成功的 App Deep Link
     *
     * ★ 不修改 ★
     * ==================================================
     */

    const apps = {

      instagram:
        "instagram://",

      facebook:
        "fb://",

      threads:
        "barcelona://"

    };


    /*
     * ==================================================
     * 狀態
     * ==================================================
     */

    let countdownRunning = false;


    /*
     * ==================================================
     * 開始 10 秒倒數
     * ==================================================
     */

    function startCountdown(event, appName) {


      /*
       * 阻止原本的 HTTPS 連結
       */

      event.preventDefault();


      /*
       * 防止重複點擊
       */

      if (countdownRunning) {

        return;

      }


      countdownRunning = true;


      /*
       * 隱藏原本選單
       */

      document
        .getElementById("title")
        .style.display = "none";


      document
        .getElementById("options")
        .style.display = "none";


      document
        .getElementById("loading")
        .style.display = "none";


      document
        .getElementById("fallback")
        .classList.remove("show");


      document
        .getElementById("note")
        .classList.remove("show");


      /*
       * 顯示黑屏
       */

      const countdown =
        document.getElementById(
          "countdown"
        );


      countdown.style.display =
        "flex";


      /*
       * 初始數字
       */

      let seconds = 10;


      const number =
        document.getElementById(
          "number"
        );


      number.textContent =
        seconds;


      /*
       * ==================================================
       * 10 → 9 → 8 → ... → 1 → 0
       * ==================================================
       */

      const timer =
        setInterval(function () {


          seconds--;


          number.textContent =
            seconds;


          /*
           * 到 0
           */

          if (seconds <= 0) {


            clearInterval(timer);


            /*
             * 保留 0 約 150ms
             */

            setTimeout(function () {

              openApp(
                appName
              );

            }, 150);


          }


        }, 1000);

    }


    /*
     * ==================================================
     * 開啟 App
     *
     * ★ 完全沿用你提供的原始成功版本 ★
     * ==================================================
     */

    function openApp(appName) {


      /*
       * 顯示原本 Loading
       */

      document
        .getElementById("loading")
        .style.display = "block";


      /*
       * 取得 App URL
       */

      const appURL =
        apps[appName];


      const webURL =
        websites[appName];


      /*
       * 記錄開始時間
       */

      const startTime =
        Date.now();


      /*
       * ==============================================
       * 原本的 App 啟動方式
       * ==============================================
       */

      window.location.href =
        appURL;


      /*
       * ==============================================
       * 原本的 fallback 邏輯
       * ==============================================
       */

      setTimeout(function () {


        if (
          Date.now() - startTime >= 1300
        ) {

          showFallback(
            webURL
          );

        }


      }, 1500);

    }


    /*
     * ==================================================
     * 顯示 fallback
     * ==================================================
     */

    function showFallback(url) {


      document
        .getElementById("loading")
        .style.display = "none";


      const fallback =
        document.getElementById(
          "fallback"
        );


      const link =
        document.getElementById(
          "fallbackLink"
        );


      const note =
        document.getElementById(
          "note"
        );


      link.href = url;


      fallback.classList.add(
        "show"
      );


      note.classList.add(
        "show"
      );

    }


  </script>


</body>

</html>
```
