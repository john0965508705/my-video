<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title></title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
            background: black;
        }
    </style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    loop
    playsinline
    preload="auto">

    <source src="video.mp4" type="video/mp4">

</video>

<script>
const video = document.getElementById("video");

video.play().catch(() => {});

video.addEventListener("click", async () => {
    try {
        if (video.requestFullscreen) {
            await video.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
        }

        video.play();
    } catch (e) {
        console.log(e);
    }
});
</script>

</body>
</html>
