```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>選擇你的窗口</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    }


    body {

      min-height: 100dvh;

    }


    .screen {

      width: 100%;
      height: 100dvh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        env(safe-area-inset-top)
        24px
        env(safe-area-inset-bottom)
        24px;

      text-align: center;

    }


    /*
     * ==========================================
     * 標題
     * ==========================================
     */

    .title {

      font-size:
        clamp(24px, 7vw, 36px);

      font-weight: 400;

      letter-spacing: 0.12em;

      margin-bottom: 55px;

    }


    /*
     * ==========================================
     * 三個選項
     * ==========================================
     */

    .options {

      width: 100%;

      max-width: 360px;

      display: flex;

      flex-direction: column;

      gap: 16px;

    }


    .option {

      width: 100%;

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 16px 20px;

      background: transparent;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.55);

      border-radius: 999px;

      font-size: 17px;

      letter-spacing: 0.08em;

      text-decoration: none;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.1s ease;

    }


    .option:active {

      background: #fff;

      color: #000;

      transform: scale(0.97);

    }


    /*
     * ==========================================
     * 倒數畫面
     * ==========================================
     */

    .countdown {

      display: none;

      flex-direction: column;

      align-items: center;

      justify-content: center;

    }


    .countdown-text {

      font-size: 15px;

      letter-spacing: 0.12em;

      opacity: 0.65;

      margin-bottom: 20px;

    }


    .number {

      font-size:
        clamp(90px, 28vw, 150px);

      font-weight: 200;

      line-height: 1;

      letter-spacing: 0;

    }


    .seconds {

      margin-top: 20px;

      font-size: 14px;

      letter-spacing: 0.1em;

      opacity: 0.5;

    }


    /*
     * ==========================================
     * 結束畫面
     * ==========================================
     */

    .finished {

      display: none;

      flex-direction: column;

      align-items: center;

      justify-content: center;

    }


    .finished-title {

      font-size:
        clamp(25px, 7vw, 36px);

      letter-spacing: 0.12em;

      margin-bottom: 20px;

    }


    .finished-text {

      font-size: 14px;

      letter-spacing: 0.08em;

      opacity: 0.55;

    }


    /*
     * ==========================================
     * Loading
     * ==========================================
     */

    .loading {

      display: none;

      flex-direction: column;

      align-items: center;

      justify-content: center;

    }


    .loading-text {

      font-size: 15px;

      letter-spacing: 0.1em;

      opacity: 0.7;

    }


    .spinner {

      width: 18px;

      height: 18px;

      margin-top: 18px;

      border:
        1.5px solid rgba(255,255,255,0.25);

      border-top-color: #fff;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {

        transform: rotate(360deg);

      }

    }


    /*
     * ==========================================
     * Fallback
     * ==========================================
     */

    .fallback {

      display: none;

      margin-top: 30px;

    }


    .fallback a {

      display: inline-block;

      padding: 13px 22px;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.6);

      border-radius: 999px;

      text-decoration: none;

      font-size: 14px;

      letter-spacing: 0.06em;

    }

  </style>

</head>


<body>


  <main class="screen">


    <!-- ========================================
         選擇頁面
         ======================================== -->

    <section
      id="selection"
    >


      <div
        class="title"
      >
        選擇你的窗口
      </div>


      <div
        class="options"
      >


        <button
          class="option"
          onclick="startExperience('instagram')"
        >
          IG Reels
        </button>


        <button
          class="option"
          onclick="startExperience('facebook')"
        >
          Facebook Reels
        </button>


        <button
          class="option"
          onclick="startExperience('threads')"
        >
          Threads
        </button>


      </div>


    </section>


    <!-- ========================================
         開啟 App
         ======================================== -->

    <section
      class="loading"
      id="loading"
    >

      <div
        class="loading-text"
      >
        正在進入你的影像流
      </div>


      <div
        class="spinner"
      ></div>


    </section>


    <!-- ========================================
         倒數
         ======================================== -->

    <section
      class="countdown"
      id="countdown"
    >

      <div
        class="countdown-text"
      >
        觀看時間
      </div>


      <div
        class="number"
        id="number"
      >
        30
      </div>


      <div
        class="seconds"
      >
        秒
      </div>

    </section>


    <!-- ========================================
         結束
         ======================================== -->

    <section
      class="finished"
      id="finished"
    >

      <div
        class="finished-title"
      >
        觀看時間結束
      </div>


      <div
        class="finished-text"
      >
        請將手機放回原處
      </div>

    </section>


  </main>


  <script>


    /*
     * ==================================================
     * 設定
     * ==================================================
     */

    const COUNTDOWN_SECONDS = 30;


    /*
     * ==================================================
     * App Deep Links
     *
     * 注意：
     *
     * 這裡只要求「開啟 App」，
     * 不要求 App 直接進入 Reels。
     *
     * 這是目前經過你 iPhone / Samsung
     * 實測成功的方式。
     * ==================================================
     */

    const appLinks = {

      instagram:
        "instagram://",

      facebook:
        "fb://",

      threads:
        "barcelona://"

    };


    /*
     * ==================================================
     * 網頁 fallback
     * ==================================================
     */

    const webLinks = {

      instagram:
        "https://www.instagram.com/",

      facebook:
        "https://www.facebook.com/",

      threads:
        "https://www.threads.net/"

    };


    /*
     * ==================================================
     * 狀態
     * ==================================================
     */

    let countdownTimer = null;

    let endTime = null;


    /*
     * ==================================================
     * 隱藏所有畫面
     * ==================================================
     */

    function hideAll() {

      document
        .getElementById("selection")
        .style.display = "none";


      document
        .getElementById("loading")
        .style.display = "none";


      document
        .getElementById("countdown")
        .style.display = "none";


      document
        .getElementById("finished")
        .style.display = "none";

    }


    /*
     * ==================================================
     * 顯示 Loading
     * ==================================================
     */

    function showLoading() {

      hideAll();


      document
        .getElementById("loading")
        .style.display = "flex";

    }


    /*
     * ==================================================
     * 顯示倒數
     * ==================================================
     */

    function showCountdown() {

      hideAll();


      document
        .getElementById("countdown")
        .style.display = "flex";

    }


    /*
     * ==================================================
     * 顯示結束
     * ==================================================
     */

    function showFinished() {

      hideAll();


      document
        .getElementById("finished")
        .style.display = "flex";

    }


    /*
     * ==================================================
     * 開始整個體驗
     * ==================================================
     */

    function startExperience(appName) {


      /*
       * 防止重複點擊
       */

      if (countdownTimer !== null) {

        return;

      }


      /*
       * 取得 App URL
       */

      const appURL =
        appLinks[appName];


      const webURL =
        webLinks[appName];


      /*
       * 顯示「正在進入」
       */

      showLoading();


      /*
       * ================================================
       * 30 秒計時在這裡正式開始
       * ================================================
       */

      endTime =
        Date.now() +
        COUNTDOWN_SECONDS * 1000;


      /*
       * 先嘗試開啟 App
       */

      try {

        window.location.href =
          appURL;

      } catch (error) {

        /*
         * 如果 Deep Link 發生錯誤，
         * 直接使用網頁版。
         */

        window.location.href =
          webURL;

      }


      /*
       * 約 1.2 秒後進入倒數畫面
       *
       * 注意：
       *
       * 如果 App 成功開啟，
       * 使用者會離開這個網頁。
       *
       * 如果 App 沒有開啟，
       * 則會在這裡看到倒數。
       */

      setTimeout(function () {

        showCountdown();

        updateCountdown();

        countdownTimer =
          setInterval(
            updateCountdown,
            250
          );

      }, 1200);

    }


    /*
     * ==================================================
     * 更新倒數
     * ==================================================
     */

    function updateCountdown() {


      if (!endTime) {

        return;

      }


      const remaining =
        Math.max(
          0,
          endTime - Date.now()
        );


      const seconds =
        Math.ceil(
          remaining / 1000
        );


      document
        .getElementById("number")
        .textContent =
        seconds;


      /*
       * 倒數結束
       */

      if (remaining <= 0) {

        clearInterval(
          countdownTimer
        );


        countdownTimer =
          null;


        showFinished();


        notifyUser();

      }

    }


    /*
     * ==================================================
     * 提醒觀眾
     * ==================================================
     *
     * 這裡使用：
     *
     * 1. 震動
     * 2. 音效
     *
     * 但手機是否允許，
     * 由 iPhone / Android 瀏覽器決定。
     * ==================================================
     */

    function notifyUser() {


      /*
       * 震動
       */

      if (
        "vibrate" in navigator
      ) {

        try {

          navigator.vibrate(
            [300, 150, 300]
          );

        } catch (error) {

          // 某些裝置不允許震動
        }

      }


      /*
       * 嘗試播放提示音
       */

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;


        if (AudioContext) {

          const audio =
            new AudioContext();


          const oscillator =
            audio.createOscillator();


          const gain =
            audio.createGain();


          oscillator.frequency.value =
            880;


          oscillator.connect(gain);


          gain.connect(
            audio.destination
          );


          gain.gain.setValueAtTime(
            0.15,
            audio.currentTime
          );


          oscillator.start();


          oscillator.stop(
            audio.currentTime + 0.25
          );

        }

      } catch (error) {

        // 某些手機會禁止網頁自動播放聲音

      }

    }


    /*
     * ==================================================
     * 當使用者返回網頁
     * ==================================================
     *
     * 如果觀眾從 Instagram /
     * Facebook / Threads 回到網頁，
     * 這裡會重新檢查倒數。
     * ==================================================
     */

    document.addEventListener(
      "visibilitychange",
      function () {


        /*
         * 頁面重新出現
         */

        if (
          document.visibilityState ===
          "visible"
        ) {


          if (
            endTime &&
            countdownTimer === null
          ) {

            /*
             * 如果 30 秒已經過去
             */

            if (
              Date.now() >= endTime
            ) {

              showFinished();

              notifyUser();

            }

            /*
             * 還沒結束
             */

            else {

              showCountdown();

              updateCountdown();

              countdownTimer =
                setInterval(
                  updateCountdown,
                  250
                );

            }

          }

        }

      }
    );


  </script>


</body>

</html>
