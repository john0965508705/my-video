```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>選擇你的窗口</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    }


    body {

      min-height: 100dvh;

    }


    .screen {

      width: 100%;
      height: 100dvh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        env(safe-area-inset-top)
        24px
        env(safe-area-inset-bottom)
        24px;

      text-align: center;

    }


    .title {

      font-size:
        clamp(24px, 7vw, 36px);

      font-weight: 400;

      letter-spacing: 0.12em;

      margin-bottom: 55px;

    }


    .options {

      width: 100%;
      max-width: 360px;

      display: flex;

      flex-direction: column;

      gap: 16px;

    }


    .option {

      width: 100%;

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 16px 20px;

      background: transparent;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.55);

      border-radius: 999px;

      font-size: 17px;

      letter-spacing: 0.08em;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.1s ease;

    }


    .option:active {

      background: #fff;

      color: #000;

      transform: scale(0.97);

    }


    .loading {

      display: none;

      margin-top: 35px;

      font-size: 15px;

      letter-spacing: 0.08em;

      opacity: 0.7;

    }


    .spinner {

      width: 18px;
      height: 18px;

      margin: 18px auto 0;

      border:
        1.5px solid rgba(255,255,255,0.25);

      border-top-color: #fff;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    .fallback {

      display: none;

      margin-top: 35px;

    }


    .fallback.show {

      display: block;

    }


    .fallback a {

      display: inline-block;

      padding: 13px 22px;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.6);

      border-radius: 999px;

      text-decoration: none;

      font-size: 14px;

      letter-spacing: 0.06em;

    }


    .note {

      display: none;

      margin-top: 14px;

      max-width: 300px;

      font-size: 12px;

      line-height: 1.6;

      opacity: 0.5;

    }


    .note.show {

      display: block;

    }

  </style>

</head>


<body>


  <main class="screen">


    <div
      class="title"
      id="title"
    >
      選擇你的窗口
    </div>


    <div
      class="options"
      id="options"
    >


      <button
        class="option"
        onclick="openInstagramReels()"
      >
        IG Reels
      </button>


      <button
        class="option"
        onclick="openFacebookReels()"
      >
        Facebook Reels
      </button>


      <button
        class="option"
        onclick="openThreads()"
      >
        Threads
      </button>


    </div>


    <div
      class="loading"
      id="loading"
    >

      正在開啟……

      <div class="spinner"></div>

    </div>


    <div
      class="fallback"
      id="fallback"
    >

      <a
        id="fallbackLink"
        href="#"
      >
        在瀏覽器開啟
      </a>

    </div>


    <div
      class="note"
      id="note"
    >

      如果 App 沒有自動開啟，
      請點擊上方按鈕。

    </div>


  </main>


  <script>


    /*
     * ==================================================
     * 網頁版網址
     * ==================================================
     */

    const instagramWeb =
      "https://www.instagram.com/reels/";


    const facebookWeb =
      "https://www.facebook.com/reels/";


    const threadsWeb =
      "https://www.threads.net/";


    /*
     * ==================================================
     * 顯示「正在開啟」
     * ==================================================
     */

    function showLoading() {

      document
        .getElementById("title")
        .style.display = "none";


      document
        .getElementById("options")
        .style.display = "none";


      document
        .getElementById("loading")
        .style.display = "block";

    }


    /*
     * ==================================================
     * 顯示最後的瀏覽器 fallback
     * ==================================================
     */

    function showFallback(url) {

      document
        .getElementById("loading")
        .style.display = "none";


      const fallback =
        document.getElementById("fallback");


      const link =
        document.getElementById("fallbackLink");


      const note =
        document.getElementById("note");


      link.href = url;


      fallback.classList.add("show");


      note.classList.add("show");

    }


    /*
     * ==================================================
     * 三層開啟機制
     * ==================================================
     *
     * 第一層：
     * App Deep Link
     *
     * 第二層：
     * HTTPS App / Universal Link
     *
     * 第三層：
     * 一般瀏覽器網址
     *
     */


    function launchWithFallback(
      appURL,
      httpsURL,
      webURL
    ) {

      showLoading();


      /*
       * ----------------------------------------------
       * 第一層
       * App Deep Link
       * ----------------------------------------------
       */

      let appAttempt =
        false;


      try {

        appAttempt = true;

        window.location.href =
          appURL;

      } catch (error) {

        appAttempt = false;

      }


      /*
       * ----------------------------------------------
       * 第二層
       *
       * 如果 App 沒有成功接管，
       * 改用 HTTPS App Link。
       * ----------------------------------------------
       */

      setTimeout(function () {

        /*
         * 如果使用者仍然停留在本頁，
         * 嘗試 HTTPS URL。
         */

        window.location.href =
          httpsURL;

      }, 900);


      /*
       * ----------------------------------------------
       * 第三層
       *
       * 如果 HTTPS 仍然沒有成功，
       * 顯示瀏覽器版本。
       * ----------------------------------------------
       */

      setTimeout(function () {

        showFallback(webURL);

      }, 2300);

    }


    /*
     * ==================================================
     * IG REELS
     * ==================================================
     */

    function openInstagramReels() {


      /*
       * 第一層：
       * Instagram App Deep Link
       */

      const appURL =
        "instagram://reels/";


      /*
       * 第二層：
       * Instagram HTTPS Reels
       */

      const httpsURL =
        "https://www.instagram.com/reels/";


      /*
       * 第三層：
       * Instagram Web Reels
       */

      const webURL =
        "https://www.instagram.com/reels/";


      launchWithFallback(
        appURL,
        httpsURL,
        webURL
      );

    }


    /*
     * ==================================================
     * FACEBOOK REELS
     * ==================================================
     */

    function openFacebookReels() {


      /*
       * 第一層：
       * Facebook App
       */

      const appURL =
        "fb://reels/";


      /*
       * 第二層：
       * Facebook HTTPS Reels
       */

      const httpsURL =
        "https://www.facebook.com/reels/";


      /*
       * 第三層：
       * Facebook Web Reels
       */

      const webURL =
        "https://www.facebook.com/reels/";


      launchWithFallback(
        appURL,
        httpsURL,
        webURL
      );

    }


    /*
     * ==================================================
     * THREADS
     * ==================================================
     */

    function openThreads() {


      /*
       * 第一層：
       * Threads App
       */

      const appURL =
        "barcelona://";


      /*
       * 第二層：
       * Threads HTTPS
       */

      const httpsURL =
        "https://www.threads.net/";


      /*
       * 第三層：
       * Threads Web
       */

      const webURL =
        "https://www.threads.net/";


      launchWithFallback(
        appURL,
        httpsURL,
        webURL
      );

    }


  </script>


</body>

</html>
```
