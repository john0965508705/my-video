<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>...</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
    }

    /* =========================
       每一個內容區塊
    ========================= */

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 500px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #000;
    }

    .content {
      position: relative;
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /* =========================
       開始畫面
    ========================= */

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      background: #000;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition: opacity 0.6s ease;
    }

    #startScreen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .startText {
      font-size: clamp(24px, 7vw, 42px);
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 40px;
    }

    .startButton {
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 999px;

      padding: 15px 35px;

      font-size: 16px;
      letter-spacing: 0.12em;

      background: transparent;
      color: #fff;
    }

    /* =========================
       底部提示
    ========================= */

    .scrollHint {
      position: absolute;
      bottom: max(25px, env(safe-area-inset-bottom));
      left: 50%;

      transform: translateX(-50%);

      font-size: 13px;
      letter-spacing: 0.15em;

      opacity: 0.45;

      animation: hintMove 1.5s infinite ease-in-out;

      pointer-events: none;
    }

    @keyframes hintMove {
      0%, 100% {
        transform: translate(-50%, 0);
        opacity: 0.25;
      }

      50% {
        transform: translate(-50%, 8px);
        opacity: 0.8;
      }
    }

    /* =========================
       1. 呼吸圓
    ========================= */

    .breathingCircle {
      width: min(55vw, 280px);
      aspect-ratio: 1;

      border-radius: 50%;

      background: #fff;

      animation: breathe 2.5s infinite ease-in-out;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(0.35);
      }

      50% {
        transform: scale(1);
      }
    }

    /* =========================
       2. 彩色漸變
    ========================= */

    .gradientBlob {
      width: 55vw;
      height: 55vw;
      max-width: 320px;
      max-height: 320px;

      border-radius: 42% 58% 63% 37% / 44% 41% 59% 56%;

      background:
        linear-gradient(
          135deg,
          #ff004c,
          #ff9d00,
          #ffee00,
          #00ff88,
          #00aaff,
          #7b00ff,
          #ff00d4
        );

      background-size: 400% 400%;

      animation:
        blobMove 4s ease-in-out infinite,
        gradientMove 5s linear infinite;
    }

    @keyframes blobMove {
      0%, 100% {
        border-radius: 42% 58% 63% 37% / 44% 41% 59% 56%;
        transform: rotate(0deg) scale(0.8);
      }

      50% {
        border-radius: 65% 35% 38% 62% / 57% 62% 38% 43%;
        transform: rotate(180deg) scale(1.05);
      }
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* =========================
       3. 完美排列
    ========================= */

    .grid {
      display: grid;

      grid-template-columns: repeat(6, 22px);
      gap: 9px;
    }

    .grid span {
      width: 22px;
      height: 22px;

      background: #fff;

      animation: gridPulse 1.2s infinite ease-in-out;
    }

    .grid span:nth-child(2n) {
      animation-delay: 0.1s;
    }

    .grid span:nth-child(3n) {
      animation-delay: 0.2s;
    }

    .grid span:nth-child(4n) {
      animation-delay: 0.3s;
    }

    @keyframes gridPulse {
      0%, 100% {
        transform: scale(0.3);
        border-radius: 50%;
      }

      50% {
        transform: scale(1);
        border-radius: 3px;
      }
    }

    /* =========================
       4. 99.99%
    ========================= */

    .loadingBox {
      width: 75%;
      max-width: 450px;
    }

    .loadingNumber {
      text-align: center;

      font-size: clamp(45px, 15vw, 90px);
      font-weight: 800;

      margin-bottom: 30px;
    }

    .loadingBar {
      width: 100%;
      height: 8px;

      background: #222;

      overflow: hidden;
    }

    .loadingFill {
      width: 99.99%;
      height: 100%;

      background: #fff;

      animation: loading 3s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        width: 70%;
      }

      70% {
        width: 99.99%;
      }

      100% {
        width: 98%;
      }
    }

    /* =========================
       5. 彈跳球
    ========================= */

    .ballArea {
      position: relative;

      width: 80%;
      max-width: 400px;
      height: 300px;

      border-bottom: 1px solid #333;
    }

    .ball {
      position: absolute;

      bottom: 0;
      left: 50%;

      width: 55px;
      height: 55px;

      border-radius: 50%;

      background: #fff;

      transform: translateX(-50%);

      animation: bounce 1.1s infinite ease-in;
    }

    @keyframes bounce {
      0%, 100% {
        bottom: 0;
        transform: translateX(-50%) scaleX(1.1) scaleY(0.9);
      }

      50% {
        bottom: 245px;
        transform: translateX(-50%) scaleX(0.95) scaleY(1.05);
      }
    }

    /* =========================
       6. 旋轉
    ========================= */

    .spinner {
      width: 180px;
      height: 180px;

      border: 5px solid #222;
      border-top-color: #fff;
      border-right-color: #fff;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       7. 大字
    ========================= */

    .bigWord {
      font-size: clamp(60px, 20vw, 150px);

      font-weight: 900;

      letter-spacing: -0.08em;

      animation: textPop 1.2s infinite ease-in-out;
    }

    @keyframes textPop {
      0%, 100% {
        transform: scale(0.75);
        opacity: 0.2;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* =========================
       8. 彩色粒子
    ========================= */

    .particles {
      position: relative;

      width: 300px;
      height: 300px;
    }

    .particle {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      animation: particleMove 2s infinite ease-out;
    }

    .particle:nth-child(1) {
      background: #ff0055;
      --x: -120px;
      --y: -100px;
    }

    .particle:nth-child(2) {
      background: #00aaff;
      --x: 120px;
      --y: -80px;
    }

    .particle:nth-child(3) {
      background: #00ff88;
      --x: -100px;
      --y: 120px;
    }

    .particle:nth-child(4) {
      background: #ffee00;
      --x: 110px;
      --y: 110px;
    }

    .particle:nth-child(5) {
      background: #aa00ff;
      --x: 0px;
      --y: -140px;
    }

    .particle:nth-child(6) {
      background: #ff7700;
      --x: 0px;
      --y: 140px;
    }

    @keyframes particleMove {
      0% {
        transform:
          translate(-50%, -50%)
          translate(0, 0)
          scale(0);
      }

      50% {
        transform:
          translate(-50%, -50%)
          translate(var(--x), var(--y))
          scale(1);
      }

      100% {
        transform:
          translate(-50%, -50%)
          translate(0, 0)
          scale(0);
      }
    }

    /* =========================
       9. 計數
    ========================= */

    .counter {
      text-align: center;
    }

    .counterSmall {
      font-size: 15px;
      opacity: 0.5;

      margin-bottom: 15px;
    }

    .counterNumber {
      font-size: clamp(80px, 25vw, 180px);

      font-weight: 900;

      line-height: 1;

      animation: counterPulse 1s infinite;
    }

    @keyframes counterPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    /* =========================
       10. 最後提示
    ========================= */

    .message {
      padding: 30px;

      text-align: center;

      font-size: clamp(24px, 7vw, 42px);

      line-height: 1.5;

      font-weight: 700;
    }

    .message small {
      display: block;

      margin-top: 30px;

      font-size: 13px;

      opacity: 0.35;

      font-weight: 400;
    }

    /* =========================
       減少動畫
    ========================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       開始畫面
  ========================= -->

  <div id="startScreen">
    <div class="startText">你想要一點快樂嗎？</div>

    <div class="startButton">
      點一下
    </div>
  </div>


  <!-- =========================
       內容
  ========================= -->

  <main id="feed"></main>


  <script>
    /* =====================================================
       廉價多巴胺
    ===================================================== */

    const feed = document.getElementById("feed");
    const startScreen = document.getElementById("startScreen");

    let pageNumber = 0;

    const contents = [
      createBreathingCircle,
      createGradientBlob,
      createGrid,
      createLoading,
      createBall,
      createSpinner,
      createBigWord,
      createParticles,
      createCounter
    ];


    /* =====================================================
       開始
    ===================================================== */

    startScreen.addEventListener("click", async () => {

      startScreen.classList.add("hide");

      /*
        嘗試啟動真正的瀏覽器 fullscreen。

        注意：
        iPhone Safari 對 fullscreen 支援有限，
        所以失敗時不影響網站正常使用。
      */

      try {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.log("Fullscreen unavailable.");
      }

      /*
        如果手機支援 Screen Orientation，
        不強制鎖定方向，讓手機自己決定。
      */

      window.scrollTo({
        top: 0,
        behavior: "instant"
      });
    });


    /* =====================================================
       建立頁面
    ===================================================== */

    function createPage(contentHTML) {

      const page = document.createElement("section");

      page.className = "page";

      page.innerHTML = `
        <div class="content">
          ${contentHTML}
        </div>

        <div class="scrollHint">
          ↓
        </div>
      `;

      feed.appendChild(page);
    }


    /* =====================================================
       1
    ===================================================== */

    function createBreathingCircle() {

      return `
        <div class="breathingCircle"></div>
      `;
    }


    /* =====================================================
       2
    ===================================================== */

    function createGradientBlob() {

      return `
        <div class="gradientBlob"></div>
      `;
    }


    /* =====================================================
       3
    ===================================================== */

    function createGrid() {

      let html = `<div class="grid">`;

      for (let i = 0; i < 36; i++) {
        html += `<span></span>`;
      }

      html += `</div>`;

      return html;
    }


    /* =====================================================
       4
    ===================================================== */

    function createLoading() {

      return `
        <div class="loadingBox">

          <div class="loadingNumber">
            99.99%
          </div>

          <div class="loadingBar">
            <div class="loadingFill"></div>
          </div>

        </div>
      `;
    }


    /* =====================================================
       5
    ===================================================== */

    function createBall() {

      return `
        <div class="ballArea">
          <div class="ball"></div>
        </div>
      `;
    }


    /* =====================================================
       6
    ===================================================== */

    function createSpinner() {

      return `
        <div class="spinner"></div>
      `;
    }


    /* =====================================================
       7
    ===================================================== */

    function createBigWord() {

      const words = [
        "WOW",
        "GOOD",
        "MORE",
        "YES",
        "AGAIN"
      ];

      const word =
        words[Math.floor(Math.random() * words.length)];

      return `
        <div class="bigWord">
          ${word}
        </div>
      `;
    }


    /* =====================================================
       8
    ===================================================== */

    function createParticles() {

      let html = `
        <div class="particles">
      `;

      for (let i = 0; i < 6; i++) {
        html += `<div class="particle"></div>`;
      }

      html += `</div>`;

      return html;
    }


    /* =====================================================
       9
    ===================================================== */

    function createCounter() {

      const number =
        Math.floor(Math.random() * 9000) + 1000;

      return `
        <div class="counter">

          <div class="counterSmall">
            YOU WON
          </div>

          <div class="counterNumber">
            +${number}
          </div>

        </div>
      `;
    }


    /* =====================================================
       10
       第 10 頁以後開始出現文字
    ===================================================== */

    function createMessage() {

      const messages = [
        "再往下。",
        "還有一個。",
        "下一個會更好。",
        "不要停。",
        "再一次。",
        "你可以繼續。",
        "還沒結束。",
        "最後一個。",
        "真的最後一個。",
        "……",
        "你為什麼還在滑？"
      ];

      const index =
        Math.min(
          Math.floor(pageNumber / 5),
          messages.length - 1
        );

      return `
        <div class="message">

          ${messages[index]}

          <small>
            ↓
          </small>

        </div>
      `;
    }


    /* =====================================================
       產生內容
    ===================================================== */

    function addNextPage() {

      pageNumber++;

      /*
        前 20 頁：
        主要提供視覺刺激
      */

      if (pageNumber <= 20) {

        const creator =
          contents[
            (pageNumber - 1) % contents.length
          ];

        createPage(creator());

      } else {

        /*
          20 頁以後：
          開始加入文字刺激
        */

        const creator =
          contents[
            Math.floor(Math.random() * contents.length)
          ];

        createPage(
          creator() +
          createMessage()
        );
      }
    }


    /* =====================================================
       初始內容
    ===================================================== */

    for (let i = 0; i < 5; i++) {
      addNextPage();
    }


    /* =====================================================
       無限下滑
    ===================================================== */

    let loading = false;

    window.addEventListener("scroll", () => {

      if (loading) return;

      const scrollPosition =
        window.scrollY + window.innerHeight;

      const pageHeight =
        document.documentElement.scrollHeight;

      /*
        距離底部 1500px 就提前生成
      */

      if (scrollPosition >
          pageHeight - 1500) {

        loading = true;

        /*
          一次產生 3 個，
          避免滑到最下面突然沒有內容。
        */

        for (let i = 0; i < 3; i++) {
          addNextPage();
        }

        setTimeout(() => {
          loading = false;
        }, 100);
      }

    });


    /* =====================================================
       防止手機雙擊縮放
    ===================================================== */

    document.addEventListener(
      "dblclick",
      event => {
        event.preventDefault();
      },
      { passive: false }
    );


    /* =====================================================
       首次觸控時再嘗試 fullscreen
    ===================================================== */

    document.addEventListener(
      "touchstart",
      async () => {

        try {

          if (
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
          ) {

            await document.documentElement.requestFullscreen();

          }

        } catch (error) {

          console.log(
            "Fullscreen unavailable."
          );

        }

      },
      {
        once: true
      }
    );

  </script>

</body>
</html>
