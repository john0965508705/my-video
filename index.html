```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>選擇你的窗口</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    }


    body {
      min-height: 100dvh;
    }


    .screen {

      width: 100%;
      height: 100dvh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        env(safe-area-inset-top)
        24px
        env(safe-area-inset-bottom)
        24px;

      text-align: center;

    }


    .title {

      font-size:
        clamp(24px, 7vw, 36px);

      font-weight: 400;

      letter-spacing: 0.12em;

      margin-bottom: 55px;

    }


    .options {

      width: 100%;

      max-width: 360px;

      display: flex;

      flex-direction: column;

      gap: 16px;

    }


    .option {

      width: 100%;

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 16px 20px;

      background: transparent;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.55);

      border-radius: 999px;

      font-size: 17px;

      letter-spacing: 0.08em;

      text-decoration: none;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.1s ease;

    }


    .option:active {

      background: #fff;

      color: #000;

      transform: scale(0.97);

    }


    /*
     * ===============================
     * Loading
     * ===============================
     */

    .loading {

      display: none;

      margin-top: 35px;

      font-size: 15px;

      letter-spacing: 0.08em;

      opacity: 0.7;

    }


    .spinner {

      width: 18px;

      height: 18px;

      margin: 18px auto 0;

      border:
        1.5px solid rgba(255,255,255,0.25);

      border-top-color: #fff;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /*
     * ===============================
     * Fallback
     * ===============================
     */

    .fallback {

      display: none;

      margin-top: 35px;

    }


    .fallback.show {
      display: block;
    }


    .fallback a {

      display: inline-block;

      padding: 13px 22px;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.6);

      border-radius: 999px;

      text-decoration: none;

      font-size: 14px;

      letter-spacing: 0.06em;

    }


    .note {

      display: none;

      margin-top: 14px;

      max-width: 300px;

      font-size: 12px;

      line-height: 1.6;

      opacity: 0.5;

    }


    .note.show {
      display: block;
    }

  </style>

</head>


<body>


  <main class="screen">


    <div
      class="title"
      id="title"
    >
      選擇你的窗口
    </div>


    <div
      class="options"
      id="options"
    >


      <!-- Instagram -->

      <a
        class="option"
        href="https://www.instagram.com/"
        onclick="openApp(event, 'instagram')"
      >
        Instagram
      </a>


      <!-- Facebook -->

      <a
        class="option"
        href="https://www.facebook.com/"
        onclick="openApp(event, 'facebook')"
      >
        Facebook
      </a>


      <!-- Threads -->

      <a
        class="option"
        href="https://www.threads.net/"
        onclick="openApp(event, 'threads')"
      >
        Threads
      </a>


    </div>


    <div
      class="loading"
      id="loading"
    >

      正在開啟……

      <div class="spinner"></div>

    </div>


    <div
      class="fallback"
      id="fallback"
    >

      <a
        id="fallbackLink"
        href="#"
      >
        在瀏覽器開啟
      </a>

    </div>


    <div
      class="note"
      id="note"
    >

      如果 App 沒有自動開啟，
      請點擊上方按鈕。

    </div>


  </main>


  <script>


    /*
     * ==========================================
     * 網頁 fallback
     * ==========================================
     */

    const websites = {

      instagram:
        "https://www.instagram.com/",

      facebook:
        "https://www.facebook.com/",

      threads:
        "https://www.threads.net/"

    };


    /*
     * ==========================================
     * 原本已經測試過的 Deep Link
     *
     * ★ 不修改 ★
     * ==========================================
     */

    const apps = {

      instagram:
        "instagram://",

      facebook:
        "fb://",

      threads:
        "barcelona://"

    };


    /*
     * ==========================================
     * 防止連續點擊
     * ==========================================
     */

    let opening = false;


    /*
     * ==========================================
     * 顯示 Loading
     * ==========================================
     */

    function showLoading() {

      document
        .getElementById("title")
        .style.display = "none";


      document
        .getElementById("options")
        .style.display = "none";


      document
        .getElementById("loading")
        .style.display = "block";

    }


    /*
     * ==========================================
     * 顯示 fallback
     * ==========================================
     */

    function showFallback(url) {

      /*
       * 如果 App 已經成功接管頁面，
       * 不再顯示 fallback。
       */

      if (
        document.visibilityState !==
        "visible"
      ) {

        return;

      }


      document
        .getElementById("loading")
        .style.display = "none";


      const fallback =
        document.getElementById(
          "fallback"
        );


      const link =
        document.getElementById(
          "fallbackLink"
        );


      const note =
        document.getElementById(
          "note"
        );


      link.href = url;


      fallback.classList.add(
        "show"
      );


      note.classList.add(
        "show"
      );

    }


    /*
     * ==========================================
     * App 開啟
     * ==========================================
     */

    function openApp(event, appName) {


      /*
       * 防止重複點擊
       */

      if (opening) {

        event.preventDefault();

        return;

      }


      opening = true;


      /*
       * 阻止 HTTPS
       */

      event.preventDefault();


      /*
       * 顯示 Loading
       */

      showLoading();


      const appURL =
        apps[appName];


      const webURL =
        websites[appName];


      /*
       * ==========================================
       * 記錄目前頁面狀態
       * ==========================================
       */

      let leftPage = false;


      /*
       * 如果 App 成功接管，
       * Samsung Internet 通常會進入 hidden。
       */

      function handleVisibility() {

        if (
          document.visibilityState ===
          "hidden"
        ) {

          leftPage = true;

        }

      }


      document.addEventListener(
        "visibilitychange",
        handleVisibility
      );


      /*
       * ==========================================
       * 立即開啟原本的 Deep Link
       *
       * 注意：
       * 這仍然發生在使用者 click 事件中。
       *
       * 這是這次最重要的修改。
       * ==========================================
       */

      window.location.href =
        appURL;


      /*
       * ==========================================
       * 3 秒後才檢查 fallback
       *
       * 原本是 1.5 秒。
       * 現在給 Samsung Internet 更多時間。
       * ==========================================
       */

      setTimeout(function () {


        document.removeEventListener(
          "visibilitychange",
          handleVisibility
        );


        /*
         * App 已成功接管
         */

        if (leftPage) {

          return;

        }


        /*
         * 頁面仍然存在：
         * 顯示網頁 fallback。
         */

        showFallback(
          webURL
        );


      }, 3000);

    }


  </script>


</body>

</html>
```
