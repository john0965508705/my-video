```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>選擇你的窗口</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    }


    body {

      min-height: 100dvh;

    }


    .screen {

      width: 100%;
      height: 100dvh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        env(safe-area-inset-top)
        24px
        env(safe-area-inset-bottom)
        24px;

      text-align: center;

    }


    .title {

      font-size:
        clamp(24px, 7vw, 36px);

      font-weight: 400;

      letter-spacing: 0.12em;

      margin-bottom: 55px;

    }


    .options {

      width: 100%;
      max-width: 360px;

      display: flex;

      flex-direction: column;

      gap: 16px;

    }


    .option {

      width: 100%;

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 16px 20px;

      background: transparent;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.55);

      border-radius: 999px;

      font-size: 17px;

      letter-spacing: 0.08em;

      text-decoration: none;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.1s ease;

    }


    .option:active {

      background: #fff;

      color: #000;

      transform: scale(0.97);

    }


    /*
     * =========================================
     * 開啟中的畫面
     * =========================================
     */

    .loading {

      display: none;

      margin-top: 35px;

      font-size: 15px;

      letter-spacing: 0.08em;

      opacity: 0.7;

    }


    .spinner {

      width: 18px;
      height: 18px;

      margin: 18px auto 0;

      border:
        1.5px solid rgba(255,255,255,0.25);

      border-top-color: #fff;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /*
     * =========================================
     * 備用按鈕
     * =========================================
     */

    .fallback {

      display: none;

      margin-top: 35px;

    }


    .fallback.show {

      display: block;

    }


    .fallback a {

      display: inline-block;

      padding: 13px 22px;

      color: #fff;

      border:
        1px solid rgba(255,255,255,0.6);

      border-radius: 999px;

      text-decoration: none;

      font-size: 14px;

      letter-spacing: 0.06em;

    }


    .note {

      display: none;

      margin-top: 14px;

      max-width: 300px;

      font-size: 12px;

      line-height: 1.6;

      opacity: 0.5;

    }


    .note.show {

      display: block;

    }

  </style>

</head>


<body>


  <main class="screen">


    <!-- =====================================
         主標題
         ===================================== -->

    <div
      class="title"
      id="title"
    >
      選擇你的窗口
    </div>


    <!-- =====================================
         三個入口
         ===================================== -->

    <div
      class="options"
      id="options"
    >


      <!-- IG Reels -->

      <a
        class="option"
        href="https://www.instagram.com/reels/"
        onclick="openDestination(event, this.href)"
      >
        IG Reels
      </a>


      <!-- Facebook Reels -->

      <a
        class="option"
        href="https://www.facebook.com/reels/"
        onclick="openDestination(event, this.href)"
      >
        Facebook Reels
      </a>


      <!-- Threads -->

      <a
        class="option"
        href="https://www.threads.net/"
        onclick="openDestination(event, this.href)"
      >
        Threads
      </a>


    </div>


    <!-- =====================================
         開啟畫面
         ===================================== -->

    <div
      class="loading"
      id="loading"
    >

      正在開啟……

      <div class="spinner"></div>

    </div>


    <!-- =====================================
         備用瀏覽器按鈕
         ===================================== -->

    <div
      class="fallback"
      id="fallback"
    >

      <a
        id="fallbackLink"
        href="#"
      >
        在瀏覽器開啟
      </a>

    </div>


    <div
      class="note"
      id="note"
    >

      如果 App 沒有自動開啟，
      請點擊上方按鈕。

    </div>


  </main>


  <script>


    /*
     * =========================================
     * 開啟目的地
     * =========================================
     *
     * 使用 HTTPS URL。
     *
     * 不再使用：
     *
     * instagram://
     * fb://
     * barcelona://
     *
     * 讓 iOS / Android 自己判斷
     * Universal Links / App Links。
     *
     */


    function openDestination(event, url) {

      /*
       * 保留瀏覽器原本的 HTTPS 導向行為。
       *
       * 手機如果設定了 App Link，
       * 系統可能直接交給對應 App。
       *
       * 如果沒有 App，
       * 則開啟網頁版。
       */


      /*
       * 顯示「正在開啟」
       */

      document
        .getElementById("title")
        .style.display = "none";


      document
        .getElementById("options")
        .style.display = "none";


      document
        .getElementById("loading")
        .style.display = "block";


      /*
       * 讓系統處理 HTTPS App Link。
       *
       * 不阻止原本的連結行為。
       */

      return true;

    }


    /*
     * =========================================
     * 當使用者返回這個頁面時
     * =========================================
     *
     * 如果 App 已經成功接管，
     * 這段不會影響 App。
     *
     * 如果沒有成功，
     * 頁面仍然可以繼續使用。
     */

    window.addEventListener(
      "pageshow",
      function () {

        /*
         * 不自動重新跳轉，
         * 避免造成循環。
         */

      }
    );


  </script>


</body>

</html>
```
